name: Build & Test

concurrency:
  group: VoiceMemory-development-build
  cancel-in-progress: true

on:
  push:
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Restore the permanent development signing identity
        shell: bash
        env:
          NEO_SIGNING_KEYSTORE: ${{ secrets.NEO_SIGNING_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -z "$NEO_SIGNING_KEYSTORE" ]; then
            echo '::error::NEO_SIGNING_KEYSTORE is missing. Restore the established secret instead of generating another signing identity.'
            exit 1
          fi
          printf '%s' "$NEO_SIGNING_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Run unit tests
        # Hosted Linux runners can otherwise resolve the Android user directory to
        # ~/.config/.android, while the persistent signing cache is in ~/.android.
        env:
          ANDROID_USER_HOME: /home/runner/.android
        run: ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest --no-daemon
      - name: Build phone and watch from the same commit
        env:
          ANDROID_USER_HOME: /home/runner/.android
        run: ./gradlew :app:assembleRelease :wear:assembleRelease --no-daemon
      - name: Verify common phone and watch application ID
        run: bash tools/verify-apk-pair.sh identity
      - name: Verify matching phone and watch signing certificates
        run: bash tools/verify-apk-pair.sh signing
      - name: Verify direct watch recorder launcher
        run: bash tools/verify-apk-pair.sh launcher
      - name: Record APK build identity
        run: bash tools/verify-apk-pair.sh
      - name: Upload tests and rendered watch screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemory-verification
          path: |
            app/build/reports/tests/
            wear/build/reports/tests/
            wear/build/reports/watch-launch.png
            wear/build/reports/watch-recording.png
            app/build/reports/notes-list.png
            wear/build/outputs/apk/release/wear-manifest.txt
            app/build/outputs/apk/release/build-identity.txt
          retention-days: 14
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: WhisperFlow-Neo-Phone
          path: app/build/outputs/apk/release/whisperflow-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: WhisperFlow-Neo-Wear
          path: wear/build/outputs/apk/release/whisperflow-wear-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload paired APKs
        uses: actions/upload-artifact@v4
        with:
          name: WhisperFlow-Neo
          path: |
            app/build/outputs/apk/release/whisperflow-release.apk
            wear/build/outputs/apk/release/whisperflow-wear-release.apk
          if-no-files-found: error
          retention-days: 7
