name: Build & Test

concurrency:
  group: VoiceMemory-development-build
  cancel-in-progress: false

on:
  push:
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Keep development signing identity stable across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: VoiceMemory-development-signing-v1
      - name: Create one shared development key before parallel builds
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest --no-daemon
      - name: Build phone and watch from the same commit
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --no-daemon
      - name: Verify common phone and watch application ID
        run: bash tools/verify-apk-pair.sh identity
      - name: Verify matching phone and watch signing certificates
        run: bash tools/verify-apk-pair.sh signing
      - name: Verify direct watch recorder launcher
        run: bash tools/verify-apk-pair.sh launcher
      - name: Record APK build identity
        run: bash tools/verify-apk-pair.sh
      - name: Upload tests and rendered watch screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemory-verification
          path: |
            app/build/reports/tests/
            wear/build/reports/tests/
            wear/build/reports/watch-launch.png
            wear/build/outputs/apk/debug/wear-manifest.txt
            app/build/outputs/apk/debug/build-identity.txt
          retention-days: 14
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemory-Phone-debug
          path: app/build/outputs/apk/debug/whisperflow-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemory-Wear-debug
          path: wear/build/outputs/apk/debug/whisperflow-wear-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload paired APKs
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemory-debug
          path: |
            app/build/outputs/apk/debug/whisperflow-debug.apk
            wear/build/outputs/apk/debug/whisperflow-wear-debug.apk
          if-no-files-found: error
          retention-days: 7
