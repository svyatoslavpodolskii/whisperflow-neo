name: Build & Test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest --no-daemon
      - name: Build phone and watch from the same commit
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --no-daemon
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemory-Phone-debug
          path: app/build/outputs/apk/debug/whisperflow-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemory-Wear-debug
          path: wear/build/outputs/apk/debug/whisperflow-wear-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload paired APKs
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMemory-debug
          path: |
            app/build/outputs/apk/debug/whisperflow-debug.apk
            wear/build/outputs/apk/debug/whisperflow-wear-debug.apk
          if-no-files-found: error
          retention-days: 7
